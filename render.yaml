services:
  - type: web
    name: ai-stock-manager
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.20.0
      - key: DATABASE_URL
        fromDatabase:
          name: ai-stock-manager-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_ORIGIN
        sync: false
databases:
  - name: ai-stock-manager-db
    plan: basic-256mb
    databaseName: ai_stock_manager
    user: ai_stock_manager
