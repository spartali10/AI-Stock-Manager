<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Giriş | AI Stock Manager</title>

    <link rel="stylesheet" href="/css/pages/login-1.css">
    <script src="/js/auth.js"></script>
    <link rel="stylesheet" href="/css/pages/login-2.css">
<link rel="stylesheet" href="/css/auth.css">
</head>

<body>

    <div class="login-box">

        <div class="logo">

            <div class="logo-icon">
                ◈
            </div>

            <h1>
                AI STOCK MANAGER
            </h1>

            <span>
                ADMIN PANEL
            </span>

        </div>

        <h2>
            Yönetici Girişi
        </h2>

        <p class="description">
            Yönetim paneline erişmek için
            kullanıcı bilgilerinizle giriş yapın.
        </p>

        <div id="error" class="error"></div>

        <form id="loginForm">

            <label>
                Kullanıcı Adı
            </label>

            <input type="text" id="username" placeholder="Kullanıcı adı" required>

            <label>
                Şifre
            </label>

            <input type="password" id="password" placeholder="Şifre" required>

            <button type="submit">
                GÜVENLİ GİRİŞ
            </button>

        </form>

        <div class="demo">

            Demo Admin:
            <br>

            Kullanıcı:
            <strong>admin</strong>

            <br>

            Şifre:
            <strong>123456</strong>

        </div>

    </div>


    

<script src="/js/login.js"></script>
</body>

</html>
